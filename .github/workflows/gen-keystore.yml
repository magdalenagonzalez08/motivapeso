name: Generate Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore motivapeso.keystore \
            -alias motivapeso -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mp2026key -keypass mp2026key \
            -dname "CN=MotivaPeso"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: motivapeso.keystore
