name: Generar APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copiar index.html a assets
        run: cp prototipo/index.html android/app/src/main/assets/index.html

      - name: Compilar APK release
        run: gradle -p android assembleRelease

      - name: Get version from tag
        id: ver
        run: echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Renombrar APK
        run: mv android/app/build/outputs/apk/release/*.apk MotivaPeso-${{ steps.ver.outputs.tag }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: MotivaPeso-${{ steps.ver.outputs.tag }}.apk
          name: ${{ steps.ver.outputs.tag }}
